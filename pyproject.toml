[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globemind"
version = "1.0.0"
description = "GlobeMind news intelligence pipeline and backend packages"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
# The repository keeps the deployable backend packages under ``backend/``
# while the reusable pipeline/config packages live at the repository root.
# Explicit mappings let an editable or wheel install expose the historical
# import names without runtime sys.path mutation.
py-modules = ["cc_integration"]

[tool.setuptools.package-dir]
"" = "."
api = "backend/api"
agentic_rag = "backend/agentic_rag"
ai_search = "backend/ai_search"
cppt = "backend/cppt"
runtime_control = "backend/runtime_control"

[tool.setuptools.packages.find]
where = ["backend", "."]
include = [
  "api*",
  "agentic_rag*",
  "ai_search*",
  "cppt*",
  "runtime_control*",
  "core_pipeline*",
  "config*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
markers = [
  "gpu: requires a CUDA-capable GPU and model weights",
  "integration: crosses process or service boundaries",
  "live_db: requires a non-ephemeral database",
  "slow: takes materially longer than the default unit suite",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "agentic_rag", "ai_search", "config", "core_pipeline", "runtime_control", "scripts"]
