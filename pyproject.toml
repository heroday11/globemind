[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
markers = [
  "gpu: requires a CUDA-capable GPU and model weights",
  "integration: crosses process or service boundaries",
  "live_db: requires a non-ephemeral database",
  "slow: takes materially longer than the default unit suite",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "agentic_rag", "scripts"]
