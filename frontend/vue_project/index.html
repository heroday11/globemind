<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f8ff">
    <meta name="description" content="GlobeMind 多语言地缘情报与世界模型态势推演平台，提供全球新闻聚合、事件脉络、涉华舆情、智能检索与研判报告。">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'">
    <title>GlobeMind · 多语言地缘情报平台</title>
    <style>
      .boot-shell{min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:24px;background:#f4f7ff;color:#17365f;font-family:Arial,"Microsoft YaHei",sans-serif}.boot-card{width:420px;max-width:100%;padding:30px;border:1px solid #dbe5f4;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(32,68,118,.12)}.boot-brand{font-size:25px;font-weight:700;letter-spacing:.02em}.boot-note{margin:12px 0 0;color:#58708f;font-size:15px;line-height:1.7}.boot-bar{height:4px;margin-top:22px;overflow:hidden;border-radius:4px;background:#e6edfa}.boot-bar:after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#3478ed;animation:boot-progress 1.2s ease-in-out infinite alternate}@keyframes boot-progress{from{transform:translateX(-20%)}to{transform:translateX(180%)}}@media(prefers-reduced-motion:reduce){.boot-bar:after{animation:none;width:65%}}
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot-shell">
        <section class="boot-card">
          <div class="boot-brand">GlobeMind</div>
          <p class="boot-note">正在启动多语言地缘情报平台…<br>弱网或旧版浏览器首次打开可能需要数秒。</p>
          <div class="boot-bar" aria-hidden="true"></div>
          <noscript><p class="boot-note">浏览器已禁用 JavaScript，请启用后重新打开。</p></noscript>
        </section>
      </main>
    </div>
    <script data-cfasync="false" type="module" src="/src/main.js"></script>
  </body>
</html>
