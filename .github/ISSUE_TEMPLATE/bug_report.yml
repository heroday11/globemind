name: Bug report
description: Report a reproducible defect with evidence and safety boundaries.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal data, production exports, or private URLs."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest local command or test and required fixtures.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks and impact
      description: List tests run, skipped dependencies, data/privacy impact, and rollback considerations.
    validations:
      required: true
