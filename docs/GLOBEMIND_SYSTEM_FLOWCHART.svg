      <stop offset="55%" stop-color="#0a5fa8"/>
      <stop offset="100%" stop-color="#0aa6b8"/>
    </linearGradient>
    <linearGradient id="cardHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b2c68"/>
      <stop offset="100%" stop-color="#0b84b6"/>
