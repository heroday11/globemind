<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">GlobeMind 全球动态认知与世界模型推演系统流程图</title>
  <desc id="desc">展示 GlobeMind 从一手全球数据获取、结构化处理、新闻事件理解、涉华舆情与全球态势、世界模型 Z_world 到推演与规划支撑的完整流程。</desc>
